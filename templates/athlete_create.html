{% extends "base.html" %}

{% block content %}
<div class="mx-auto max-w-(--breakpoint-2xl) p-4 md:p-6">
  <div class="rounded-2xl border border-gray-200 bg-white px-5 py-7 dark:border-gray-800 dark:bg-white/[0.03] sm:px-6">
    <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <h3 class="text-theme-xl font-semibold text-gray-800 dark:text-white/90">
          Agregar atleta
        </h3>
        <p class="text-sm text-gray-500 dark:text-gray-400">
          Registra los datos basicos del atleta para las evaluaciones.
        </p>
      </div>
    </div>

    {% if status %}
      <div class="mt-4 rounded-lg border border-green-200 bg-green-50 px-4 py-3 text-sm text-green-700">
        {{ status }}
      </div>
    {% endif %}

    {% if errors %}
      <div class="mt-4 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
        <ul class="list-disc pl-4">
          {% for error in errors %}
            <li>{{ error }}</li>
          {% endfor %}
        </ul>
      </div>
    {% endif %}

    <form class="mt-6 space-y-6" method="post" action="/athletes/new">
      <div class="grid gap-6 sm:grid-cols-2">
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">
            ID
          </label>
          <input
            type="text"
            name="document_id"
            value="{{ form_data.get('document_id', '') }}"
            required
            class="dark:bg-dark-900 shadow-theme-xs focus:border-brand-300 focus:ring-brand-500/10 dark:focus:border-brand-800 h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-3 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30"
          />
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">
            Sexo
          </label>
          <div x-data="{ isOptionSelected: false }" class="relative z-20 bg-transparent">
            <select
              name="sex"
              required
              class="dark:bg-dark-900 shadow-theme-xs focus:border-brand-300 focus:ring-brand-500/10 dark:focus:border-brand-800 h-11 w-full appearance-none rounded-lg border border-gray-300 bg-transparent bg-none px-4 py-2.5 pr-11 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-3 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30"
              :class="isOptionSelected && 'text-gray-800 dark:text-white/90'"
              @change="isOptionSelected = true"
            >
              <option value="" class="text-gray-700 dark:bg-gray-900 dark:text-gray-400">Selecciona una opcion</option>
              <option value="Masculino" {% if form_data.get('sex') == 'Masculino' %}selected{% endif %}>Masculino</option>
              <option value="Femenino" {% if form_data.get('sex') == 'Femenino' %}selected{% endif %}>Femenino</option>
              <option value="Otro" {% if form_data.get('sex') == 'Otro' %}selected{% endif %}>Otro</option>
            </select>
          </div>
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">
            Nombre
          </label>
          <input
            type="text"
            name="first_name"
            value="{{ form_data.get('first_name', '') }}"
            required
            class="dark:bg-dark-900 shadow-theme-xs focus:border-brand-300 focus:ring-brand-500/10 dark:focus:border-brand-800 h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-3 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30"
          />
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">
            Apellido
          </label>
          <input
            type="text"
            name="last_name"
            value="{{ form_data.get('last_name', '') }}"
            required
            class="dark:bg-dark-900 shadow-theme-xs focus:border-brand-300 focus:ring-brand-500/10 dark:focus:border-brand-800 h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-3 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30"
          />
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">
            Edad
          </label>
          <input
            type="number"
            min="1"
            name="age"
            value="{{ form_data.get('age', '') }}"
            required
            class="dark:bg-dark-900 shadow-theme-xs focus:border-brand-300 focus:ring-brand-500/10 dark:focus:border-brand-800 h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-3 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30"
          />
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">
            Peso corporal (kg)
          </label>
          <input
            type="number"
            step="0.1"
            min="1"
            name="body_weight"
            value="{{ form_data.get('body_weight', '') }}"
            required
            class="dark:bg-dark-900 shadow-theme-xs focus:border-brand-300 focus:ring-brand-500/10 dark:focus:border-brand-800 h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-3 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30"
          />
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">
            Categoria
          </label>
          <input
            type="text"
            name="category"
            value="{{ form_data.get('category', '') }}"
            required
            class="dark:bg-dark-900 shadow-theme-xs focus:border-brand-300 focus:ring-brand-500/10 dark:focus:border-brand-800 h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-3 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30"
          />
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">
            Nivel
          </label>
          <div x-data="{ isOptionSelected: false }" class="relative z-20 bg-transparent">
            <select
              name="level"
              required
              class="dark:bg-dark-900 shadow-theme-xs focus:border-brand-300 focus:ring-brand-500/10 dark:focus:border-brand-800 h-11 w-full appearance-none rounded-lg border border-gray-300 bg-transparent bg-none px-4 py-2.5 pr-11 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-3 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30"
              :class="isOptionSelected && 'text-gray-800 dark:text-white/90'"
              @change="isOptionSelected = true"
            >
              <option value="" class="text-gray-700 dark:bg-gray-900 dark:text-gray-400">Selecciona una opcion</option>
              <option value="Novato" {% if form_data.get('level') == 'Novato' %}selected{% endif %}>Novato</option>
              <option value="Intermedio" {% if form_data.get('level') == 'Intermedio' %}selected{% endif %}>Intermedio</option>
              <option value="Avanzado" {% if form_data.get('level') == 'Avanzado' %}selected{% endif %}>Avanzado</option>
            </select>
          </div>
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">
            Anos entrenando
          </label>
          <input
            type="number"
            min="0"
            name="years_training"
            value="{{ form_data.get('years_training', '') }}"
            required
            class="dark:bg-dark-900 shadow-theme-xs focus:border-brand-300 focus:ring-brand-500/10 dark:focus:border-brand-800 h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-3 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30"
          />
        </div>
      </div>
      <div>
        <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">
          Observaciones
        </label>
        <textarea
          name="notes"
          rows="4"
          class="dark:bg-dark-900 shadow-theme-xs focus:border-brand-300 focus:ring-brand-500/10 dark:focus:border-brand-800 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-3 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30"
        >{{ form_data.get('notes', '') }}</textarea>
      </div>
      <div class="flex justify-end">
        <button
          type="submit"
          class="rounded-lg bg-brand-500 px-5 py-2.5 text-sm font-medium text-white shadow-theme-xs hover:bg-brand-600"
        >
          Guardar atleta
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
