<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Iniciar sesion | Evolution Machine</title>
    <link rel="icon" href="/static/tailadmin/favicon.ico" />
    <link href="/static/tailadmin/style.css" rel="stylesheet" />
  </head>
  <body
    x-data="{ 'loaded': true, 'darkMode': false }"
    x-init="
      darkMode = JSON.parse(localStorage.getItem('darkMode'));
      $watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)))"
    :class="{'dark bg-gray-900': darkMode === true}"
  >
    <div
      x-show="loaded"
      x-init="window.addEventListener('DOMContentLoaded', () => {setTimeout(() => loaded = false, 300)})"
      class="fixed left-0 top-0 z-999999 flex h-screen w-screen items-center justify-center bg-white dark:bg-black"
    >
      <div
        class="h-16 w-16 animate-spin rounded-full border-4 border-solid border-brand-500 border-t-transparent"
      ></div>
    </div>

    <div class="relative p-6 bg-white z-1 dark:bg-gray-900 sm:p-0">
      <div class="relative flex flex-col justify-center w-full h-screen dark:bg-gray-900 sm:p-0 lg:flex-row">
        <div class="flex flex-col flex-1 w-full lg:w-1/2">
          <div class="w-full max-w-md pt-10 mx-auto">
            <a
              href="/"
              class="inline-flex items-center text-sm text-gray-500 transition-colors hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-300"
            >
              <svg
                class="stroke-current"
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 20 20"
                fill="none"
              >
                <path
                  d="M12.7083 5L7.5 10.2083L12.7083 15.4167"
                  stroke=""
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              Ir al inicio
            </a>
          </div>
          <div class="flex flex-col justify-center flex-1 w-full max-w-md mx-auto">
            <div class="mb-5 sm:mb-8">
              <h1 class="mb-2 font-semibold text-gray-800 text-title-sm dark:text-white/90 sm:text-title-md">
                Iniciar sesion
              </h1>
              <p class="text-sm text-gray-500 dark:text-gray-400">
                Accede al panel de evaluacion tecnica.
              </p>
            </div>
            <form method="post" action="/login">
              <div class="space-y-5">
                <div>
                  <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">
                    Usuario
                  </label>
                  <input
                    type="text"
                    name="username"
                    required
                    class="dark:bg-dark-900 h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
                  />
                </div>
                <div>
                  <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">
                    Contrasena
                  </label>
                  <input
                    type="password"
                    name="password"
                    required
                    class="dark:bg-dark-900 h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
                  />
                </div>
                {% if error %}
                <div class="rounded-lg border border-error-200 bg-error-50 px-4 py-3 text-sm text-error-600">
                  {{ error }}
                </div>
                {% endif %}
                <button
                  type="submit"
                  class="inline-flex w-full items-center justify-center rounded-lg bg-brand-500 px-4 py-2.5 text-sm font-medium text-white shadow-theme-xs hover:bg-brand-600"
                >
                  Entrar
                </button>
                <p class="text-sm text-gray-500 dark:text-gray-400">
                  No tienes cuenta?
                  <a href="/register" class="text-brand-500 hover:text-brand-600">Crear cuenta</a>
                </p>
              </div>
            </form>
          </div>
        </div>

        <div class="hidden w-full bg-gray-50 dark:bg-gray-800 lg:flex lg:w-1/2">
          <div class="flex w-full items-center justify-center p-10">
            <div class="max-w-md">
              <h2 class="mb-3 text-2xl font-semibold text-gray-800 dark:text-white/90">
                Evolution Machine
              </h2>
              <p class="text-sm text-gray-500 dark:text-gray-400">
                Sistema web para evaluacion tecnica en competencias de powerlifting.
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/static/tailadmin/bundle.js"></script>
  </body>
</html>
