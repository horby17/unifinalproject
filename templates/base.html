<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>{{ page_title }} | Evolution Machine</title>
    <link rel="icon" href="/static/tailadmin/favicon.ico" />
    <link href="/static/tailadmin/style.css" rel="stylesheet" />
    {% block extra_css %}{% endblock %}
  </head>
  <body
    x-data="{ 'loaded': true, 'darkMode': false, 'sidebarToggle': false }"
    x-init="
      darkMode = JSON.parse(localStorage.getItem('darkMode'));
      $watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)))"
    :class="{'dark bg-gray-900': darkMode === true}"
  >
    <div
      x-show="loaded"
      x-init="window.addEventListener('DOMContentLoaded', () => {setTimeout(() => loaded = false, 300)})"
      class="fixed left-0 top-0 z-999999 flex h-screen w-screen items-center justify-center bg-white dark:bg-black"
    >
      <div
        class="h-16 w-16 animate-spin rounded-full border-4 border-solid border-brand-500 border-t-transparent"
      ></div>
    </div>

    <div class="flex h-screen overflow-hidden">
      <aside
        :class="sidebarToggle ? 'translate-x-0 lg:w-[90px]' : '-translate-x-full'"
        class="sidebar fixed left-0 top-0 z-9999 flex h-screen w-[290px] flex-col overflow-y-hidden border-r border-gray-200 bg-white px-5 dark:border-gray-800 dark:bg-black lg:static lg:translate-x-0"
      >
        <div
          :class="sidebarToggle ? 'justify-center' : 'justify-between'"
          class="flex items-center gap-2 pt-8 sidebar-header pb-7"
        >
          <a href="/dashboard" aria-label="Evolution Machine — Inicio" class="flex items-center gap-3">
            <img src="/static/images/bench-press.png" alt="" width="42" height="42" style="object-fit: contain; background: white; border-radius: 10px; padding: 4px; flex-shrink: 0;" />
            <span :class="sidebarToggle ? 'hidden' : ''" class="text-sm font-semibold text-gray-800 dark:text-white/90">Evolution Machine</span>
          </a>
        </div>

        <div class="flex flex-col overflow-y-auto duration-300 ease-linear no-scrollbar">
          <nav x-data="{selected: '{{ 'Atletas' if active_page == 'athlete_create' else '' }}'}">
            <div>
              <h3 class="mb-4 text-xs uppercase leading-[20px] text-gray-400">
                <span class="menu-group-title" :class="sidebarToggle ? 'lg:hidden' : ''">
                  Menu
                </span>
                <svg
                  :class="sidebarToggle ? 'lg:block hidden' : 'hidden'"
                  class="mx-auto fill-current menu-group-icon"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"

                    class="translate transform overflow-hidden"
                    :class="(selected === 'Atletas') ? 'block' :'hidden'"
                  >
                    <ul
                      :class="sidebarToggle ? 'lg:hidden' : 'flex'"
                      class="menu-dropdown mt-2 flex flex-col gap-1 pl-9"
                    >
                      <li>
                        <a
                          href="/athletes/new"
                          class="menu-dropdown-item group {{ 'menu-dropdown-item-active' if active_page == 'athlete_create' else 'menu-dropdown-item-inactive' }}"
                        >
                          Agregar atleta
                        </a>
                      </li>
                    </ul>
                  </div>
                </li>
                <li>
                  <a
                    href="/results"
                    class="menu-item group {{ 'menu-item-active' if active_page == 'results' else 'menu-item-inactive' }}"
                  >
                    <svg class="{{ 'menu-item-icon-active' if active_page == 'results' else 'menu-item-icon-inactive' }}" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                      <path d="M4 4H20V20H4V4ZM4 9H20M9 9V20M4 14H20" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
                    </svg>

                  </a>
                </li>
                <li>

                </h2>
                <p class="text-sm text-gray-500 dark:text-gray-400">{{ username }}</p>
              </div>
            </div>
            <button
              class="flex h-10 w-10 items-center justify-center rounded-full border border-gray-200 bg-white text-gray-500 transition-colors hover:bg-gray-100 hover:text-gray-700 dark:border-gray-800 dark:bg-gray-900 dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:text-white"
